name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build:web
      - run: npm --workspace apps/worker run typecheck
      - name: Validate Wrangler production bundle
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const path = "wrangler.jsonc";
          const cfg = JSON.parse(fs.readFileSync(path, "utf8"));
          cfg.d1_databases[0].database_id = "00000000-0000-0000-0000-000000000000";
          fs.writeFileSync(path, JSON.stringify(cfg, null, 2) + "\n");
          NODE
          npx wrangler deploy --dry-run --config wrangler.jsonc --outdir /tmp/wrangler-dry

  cad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r services/cad/requirements.txt pytest
      - run: PYTHONPATH=services/cad pytest -q services/cad/tests
