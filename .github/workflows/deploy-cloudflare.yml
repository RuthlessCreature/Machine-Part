name: Deploy Cloudflare

on:
  workflow_dispatch:

concurrency:
  group: machine-part-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$MINIMAX_API_KEY" || { echo "Missing MINIMAX_API_KEY"; exit 1; }

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Ensure D1 database
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > /tmp/d1.json
          DB_ID="$(node - <<'NODE'
          const fs = require("fs");
          const raw = JSON.parse(fs.readFileSync("/tmp/d1.json", "utf8"));
          const list = Array.isArray(raw) ? raw : (raw.result || []);
          const db = list.find(x => x.name === "machine-part");
          if (db) process.stdout.write(db.uuid || db.id || "");
          NODE
          )"
          if [ -z "$DB_ID" ]; then
            npx wrangler d1 create machine-part --location apac
            npx wrangler d1 list --json > /tmp/d1.json
            DB_ID="$(node - <<'NODE'
          const fs = require("fs");
          const raw = JSON.parse(fs.readFileSync("/tmp/d1.json", "utf8"));
          const list = Array.isArray(raw) ? raw : (raw.result || []);
          const db = list.find(x => x.name === "machine-part");
          if (!db) process.exit(2);
          process.stdout.write(db.uuid || db.id || "");
          NODE
            )"
          fi
          test -n "$DB_ID"
          DB_ID="$DB_ID" node - <<'NODE'
          const fs = require("fs");
          const path = "wrangler.jsonc";
          const cfg = JSON.parse(fs.readFileSync(path, "utf8"));
          cfg.d1_databases[0].database_id = process.env.DB_ID;
          fs.writeFileSync(path, JSON.stringify(cfg, null, 2) + "\n");
          NODE
          echo "D1 machine-part ready."

      - name: Ensure R2 bucket
        shell: bash
        run: |
          set -euo pipefail
          if ! npx wrangler r2 bucket info machine-part-artifacts --json >/dev/null 2>&1; then
            npx wrangler r2 bucket create machine-part-artifacts --location apac
          fi
          echo "R2 machine-part-artifacts ready."

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply machine-part --remote --config wrangler.jsonc

      - name: Build web
        run: npm run build:web

      - name: Typecheck Worker
        run: npm --workspace apps/worker run typecheck

      - name: Deploy Worker + Container + ikun.homes
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Install MiniMax Token Plan key
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$MINIMAX_API_KEY" | npx wrangler secret put MINIMAX_API_KEY --config wrangler.jsonc

      - name: Verify production health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent             --retry 20 --retry-delay 10 --retry-all-errors             https://ikun.homes/api/health | tee /tmp/health.json
          node - <<'NODE'
          const fs = require("fs");
          const x = JSON.parse(fs.readFileSync("/tmp/health.json", "utf8"));
          if (!x.ok || x.service !== "machine-part") process.exit(1);
          console.log("Production health OK:", x);
          NODE
